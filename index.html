<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Občanství - Zkouška</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <section id="dashboard">
            <h1>Zkouška z českého občanství</h1>
            <div class="menu-grid">
                <button onclick="startTest('test')">🎓 Režim Zkouška</button>
                <button onclick="startTest('practice')">📚 Režim Procvičování</button>
                <button onclick="showSection('stats')">📊 Statistiky</button>
                <button onclick="showSection('errors')">⚠️ Moje chyby</button>
            </div>
        </section>

        <section id="test-screen" class="hidden">
            <div id="progress-bar"><div id="progress-fill"></div></div>
            <div id="quiz-container"></div>
        </section>

        <section id="results-screen" class="hidden">
            <h2>Výsledek testu</h2>
            <div id="score-summary"></div>
            <div id="review-container"></div>
            <button onclick="showSection('dashboard')">Zpět do menu</button>
        </section>

        <section id="stats-screen" class="hidden">
            <h2>Statistiky</h2>
            <div id="stats-content"></div>
            <button onclick="showSection('dashboard')">Zpět</button>
        </section>

        <section id="errors-screen" class="hidden">
            <h2>Moje chyby</h2>
            <div id="errors-content"></div>
            <button onclick="showSection('dashboard')">Zpět</button>
        </section>
    </div>
    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
